name: Release & Deploy

# En cada push a main: 1) semantic-release sube la versión según los commits,
# genera CHANGELOG y crea la release en GitHub, y 2) compila y publica la app
# en Firebase Hosting. Es el "Deploy" automático, ahora con versionado.
on:
  push:
    branches:
      - main
  workflow_dispatch: {} # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: write # crear tags, commit de versión y releases
  issues: write
  pull-requests: write

# Evita despliegues simultáneos pisándose entre sí.
concurrency:
  group: release-deploy
  cancel-in-progress: false

jobs:
  release_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # semantic-release necesita todo el historial y los tags

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test (Harmony Engine)
        run: npm test

      # Compuerta de interfaz: levanta la app compilada en Chromium y falla si
      # hay errores de JS, si no renderiza, si el modo de layout no corresponde
      # o si algo desborda. Va ANTES del release para que un fallo no deje una
      # versión publicada sin desplegar. `tsc` y los tests unitarios no ven
      # errores de runtime: una pantalla en blanco llegó a producción pasando
      # lint, tests y dos revisiones de código.
      - name: Instalar Chromium para la prueba de humo
        run: npx playwright install --with-deps chromium

      - name: Prueba de humo de la interfaz
        run: npm run build && npm run smoke

      - name: Semantic Release (versionado automático)
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: npm run build
        env:
          # La clave de Gemini se inyecta en el build (igual que hacía AI Studio).
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: franco-control
          channelId: live

      - name: Deploy Firestore rules
        # La cuenta de servicio firebase-adminsdk no tiene permiso de serviceusage
        # para el pre-chequeo de API; si falla no debe tumbar el deploy de hosting.
        # En cuanto se le concedan los roles necesarios, este paso desplegará solo.
        continue-on-error: true
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          npx --yes firebase-tools@latest deploy --only firestore:rules --project franco-control --non-interactive
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
