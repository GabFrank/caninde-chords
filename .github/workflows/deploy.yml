name: Deploy to Firebase Hosting

# Publica la app automáticamente cada vez que haces push a main.
# Equivalente al "Deploy" automático que hacía AI Studio.
on:
  push:
    branches:
      - main
  workflow_dispatch: {} # permite lanzar el deploy manualmente desde la pestaña Actions

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # La clave de Gemini se inyecta en el build (igual que hacía AI Studio).
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: franco-control
          channelId: live
